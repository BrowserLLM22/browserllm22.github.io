<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Local WebLLM Chat</title>
  <style>
    :root {
      --bg: #212121;
      --panel: #2f2f2f;
      --panel-2: #171717;
      --text: #ececec;
      --muted: #b4b4b4;
      --line: #424242;
      --accent: #10a37f;
      --danger: #ff6b6b;
      --shadow: rgba(0,0,0,.28);
      --radius: 18px;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); }
    body { height: 100dvh; overflow: hidden; }
    button, select, textarea { font: inherit; }

    .app { height: 100dvh; display: grid; grid-template-columns: 292px 1fr; }

    .sidebar {
      background: var(--panel-2);
      border-right: 1px solid var(--line);
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; }
    .logo { width: 30px; height: 30px; border-radius: 9px; background: linear-gradient(135deg, #10a37f, #7dd3fc); }

    .side-card {
      background: #242424;
      border: 1px solid #343434;
      border-radius: 14px;
      padding: 12px;
    }

    label { color: var(--muted); font-size: 12px; }
    select {
      width: 100%;
      background: #303030;
      border: 1px solid #4b4b4b;
      border-radius: 12px;
      padding: 10px;
      color: var(--text);
    }

    .btn {
      width: 100%;
      padding: 10px;
      border-radius: 12px;
      border: 1px solid #4b4b4b;
      background: #303030;
      color: var(--text);
      cursor: pointer;
    }

    .btn.primary { background: var(--accent); border-color: var(--accent); color: white; }
    .btn.danger { color: #ffd6d6; background: rgba(255,107,107,.09); }

    .progress-wrap { display: none; flex-direction: column; gap: 6px; }
    .progress-wrap.active { display: flex; }

    .progress {
      height: 8px;
      background: #151515;
      border-radius: 999px;
      overflow: hidden;
    }

    .bar {
      height: 100%;
      width: 0%;
      background: var(--accent);
      transition: width .2s;
    }

    .status { font-size: 12px; color: var(--muted); }

    .main { display: grid; grid-template-rows: auto 1fr auto; }

    .topbar {
      height: 50px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      border-bottom: 1px solid var(--line);
    }

    .messages {
      overflow-y: auto;
      padding: 16px;
    }

    .msg { margin-bottom: 14px; }
    .user .bubble {
      background: var(--panel);
      padding: 10px;
      border-radius: 12px;
    }

    .assistant .bubble {
      padding: 10px;
    }

    .composer {
      display: flex;
      gap: 8px;
      padding: 10px;
      border-top: 1px solid var(--line);
    }

    textarea {
      flex: 1;
      background: var(--panel);
      border: 1px solid #4b4b4b;
      border-radius: 12px;
      padding: 8px;
      color: var(--text);
      resize: none;
    }

    .send {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: none;
      background: var(--text);
      color: black;
      cursor: pointer;
    }

    .error {
      background: rgba(255,107,107,.2);
      padding: 10px;
      border-radius: 10px;
      font-size: 12px;
    }
  </style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="logo"></div>
      Local WebLLM
    </div>

    <div class="side-card">
      <label>Modell</label>
      <select id="modelSelect">
        <option value="Llama-3.2-1B-Instruct-q4f16_1-MLC">1B Modell</option>
        <option value="SmolLM2-1.7B-Instruct-q4f16_1-MLC">~2B Modell</option>
        <option value="gemma-2-2b-it-q4f16_1-MLC">Gemma 2B</option>
        <option value="Phi-3.5-mini-instruct-q4f16_1-MLC-1k">Phi Mini</option>
      </select>
      <button class="btn primary" id="loadBtn">Laden</button>
    </div>

    <div class="side-card progress-wrap" id="progressWrap">
      <div class="progress"><div class="bar" id="bar"></div></div>
      <div class="status" id="status">Bereit</div>
    </div>

    <div class="side-card">
      <button class="btn" id="newChat">Neuer Chat</button>
      <button class="btn danger" id="clearCache">Cache löschen</button>
    </div>

    <div id="errorBox"></div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div id="state">Nicht geladen</div>
    </div>

    <div class="messages" id="messages"></div>

    <form class="composer" id="form">
      <textarea id="input"></textarea>
      <button class="send">↑</button>
    </form>
  </main>
</div>

<script type="module">
import { CreateMLCEngine } from "https://esm.run/@mlc-ai/web-llm";

const state = document.getElementById("state");
const bar = document.getElementById("bar");
const status = document.getElementById("status");
const progressWrap = document.getElementById("progressWrap");
const errorBox = document.getElementById("errorBox");
const messagesEl = document.getElementById("messages");

let engine = null;
let messages = JSON.parse(localStorage.getItem("chat") || "[]");

function save() {
  localStorage.setItem("chat", JSON.stringify(messages));
}

function render() {
  messagesEl.innerHTML = "";
  messages.forEach(m => {
    const div = document.createElement("div");
    div.className = "msg " + m.role;
    div.innerHTML = '<div class="bubble"></div>';
    div.querySelector(".bubble").textContent = m.content;
    messagesEl.appendChild(div);
  });
}

render();

if (!("gpu" in navigator)) {
  errorBox.innerHTML = '<div class="error">WebGPU nicht verfügbar.</div>';
}

document.getElementById("loadBtn").onclick = async () => {
  const model = document.getElementById("modelSelect").value;
  progressWrap.classList.add("active");

  engine = await CreateMLCEngine(model, {
    initProgressCallback: (p) => {
      bar.style.width = (p.progress * 100) + "%";
      status.textContent = p.text;
    }
  });

  state.textContent = "Bereit";
};

document.getElementById("form").onsubmit = async (e) => {
  e.preventDefault();
  if (!engine) return;

  const input = document.getElementById("input");
  const text = input.value.trim();
  if (!text) return;

  input.value = "";

  messages.push({ role: "user", content: text });
  render();

  const msg = { role: "assistant", content: "" };
  messages.push(msg);
  render();

  const stream = await engine.chat.completions.create({
    messages,
    stream: true
  });

  for await (const chunk of stream) {
    const t = chunk.choices[0].delta?.content || "";
    msg.content += t;
    render();
  }

  save();
};

document.getElementById("newChat").onclick = () => {
  messages = [];
  save();
  render();
};

document.getElementById("clearCache").onclick = async () => {
  if ("caches" in window) {
    const keys = await caches.keys();
    await Promise.all(keys.map(k => caches.delete(k)));
  }
  localStorage.clear();
  location.reload();
};
</script>
</body>
</html>
