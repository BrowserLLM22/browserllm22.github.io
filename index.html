<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lokale KI im Browser</title>

<style>
body{
  margin:0;
  padding:20px;
  background:#0b1020;
  color:white;
  font-family:-apple-system,BlinkMacSystemFont,sans-serif;
}

h1{
  font-size:48px;
  margin-bottom:20px;
}

.card{
  background:#121a2f;
  border-radius:24px;
  padding:20px;
  margin-bottom:20px;
}

textarea{
  width:100%;
  min-height:140px;
  background:#09101f;
  color:white;
  border:none;
  border-radius:18px;
  padding:16px;
  font-size:16px;
  box-sizing:border-box;
}

select{
  background:#09101f;
  color:white;
  border:none;
  padding:12px;
  border-radius:12px;
}

button{
  margin-top:12px;
  border:none;
  background:#60a5fa;
  color:black;
  padding:14px 18px;
  border-radius:999px;
  font-weight:700;
  cursor:pointer;
}

button:disabled{
  opacity:.5;
}

.message{
  margin-top:14px;
  padding:14px;
  border-radius:18px;
  background:#1b2747;
  white-space:pre-wrap;
}
</style>
</head>

<body>

<h1>Lokale KI im Browser</h1>

<div class="card">

<p id="status">
Prüfe WebGPU...
</p>

<select id="model">

<option value="Qwen2.5-0.5B-Instruct-q4f16_1-MLC">
Qwen 0.5B
</option>

<option value="Llama-3.2-1B-Instruct-q4f16_1-MLC">
Llama 3.2 1B
</option>

</select>

<br><br>

<button id="loadBtn">
Modell laden
</button>

<p id="log"></p>

</div>

<div class="card">

<textarea
id="prompt"
placeholder="Nachricht eingeben..."
></textarea>

<button id="sendBtn" disabled>
Senden
</button>

<div id="chat"></div>

</div>

<script type="module">

const statusEl =
document.getElementById("status");

const logEl =
document.getElementById("log");

const loadBtn =
document.getElementById("loadBtn");

const sendBtn =
document.getElementById("sendBtn");

const promptEl =
document.getElementById("prompt");

const chatEl =
document.getElementById("chat");

const modelEl =
document.getElementById("model");

let engine = null;

if("gpu" in navigator){

  statusEl.textContent =
  "✅ WebGPU verfügbar";

}else{

  statusEl.textContent =
  "❌ WebGPU nicht verfügbar";

}

function addMessage(role,text){

  const div =
  document.createElement("div");

  div.className = "message";

  div.innerHTML =
  "<b>" + role + ":</b><br>" + text;

  chatEl.appendChild(div);

  return div;
}

loadBtn.onclick = async () => {

  loadBtn.disabled = true;

  logEl.textContent =
  "Lade WebLLM...";

  try{

    const webllm =
    await import(
      "https://esm.run/@mlc-ai/web-llm"
    );

    logEl.textContent =
    "Lade Modell...";

    engine =
    await webllm.CreateMLCEngine(
      modelEl.value,
      {
        initProgressCallback:(p)=>{

          logEl.textContent =
          p.text || "Lade...";
        }
      }
    );

    logEl.textContent =
    "✅ Modell bereit";

    sendBtn.disabled = false;

  }catch(error){

    console.error(error);

    logEl.textContent =
    "Fehler: " + error.message;

    loadBtn.disabled = false;
  }
};

sendBtn.onclick = async () => {

  const text =
  promptEl.value.trim();

  if(!text || !engine) return;

  addMessage("Du",text);

  promptEl.value = "";

  sendBtn.disabled = true;

  const out =
  addMessage("KI","");

  try{

    const stream =
    await engine.chat.completions.create({

      messages:[
        {
          role:"system",
          content:
          "Antworte kurz und hilfreich auf Deutsch."
        },
        {
          role:"user",
          content:text
        }
      ],

      stream:true
    });

    for await(
      const chunk of stream
    ){

      out.innerHTML +=
      chunk.choices?.[0]?.delta?.content || "";
    }

  }catch(error){

    out.innerHTML +=
    "\nFehler: " + error.message;

  }

  sendBtn.disabled = false;
};

</script>

</body>
</html>
